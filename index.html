<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marine Biologist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1916;
    --bg-card: #201f1c;
    --bg-hover: #262420;
    --border: rgba(255,255,255,0.07);
    --border-soft: rgba(255,255,255,0.04);
    --text-primary: #e8e4dc;
    --text-secondary: #9a9488;
    --text-muted: #5e5a54;
    --accent: #c9a96e;
    --accent-soft: rgba(201, 169, 110, 0.12);
    --tag-bg: rgba(255,255,255,0.05);
    --font-serif: 'Lora', Georgia, serif;
    --font-sans: 'Source Sans 3', sans-serif;
    --max-w: 680px;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 17px;
    line-height: 1.7;
    min-height: 100vh;
  }

  /* ─── NAV ─── */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(26, 25, 22, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
  }
  .nav-inner {
    max-width: 900px;
    margin: 0 auto;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .nav-profile {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent-soft);
    border: 1px solid rgba(201,169,110,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  .avatar svg { color: var(--accent); }
  .blog-name {
    font-family: var(--font-serif);
    font-size: 1rem;
    color: var(--text-primary);
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 0.25rem;
  }
  .nav-link {
    font-size: 0.82rem;
    font-weight: 400;
    color: var(--text-secondary);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    transition: color 0.15s, background 0.15s;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .nav-link:hover { color: var(--text-primary); background: rgba(255,255,255,0.04); }
  .nav-link.active { color: var(--accent); }

  /* ─── MAIN LAYOUT ─── */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 3.5rem 1.5rem 5rem;
    display: grid;
    grid-template-columns: 1fr 260px;
    gap: 3.5rem;
    align-items: start;
  }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; gap: 2.5rem; }
    .sidebar { order: -1; }
  }

  /* ─── PAGE SECTIONS ─── */
  .page { display: none; }
  .page.active { display: block; }

  /* ─── FEED ─── */
  .feed-header {
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  .feed-title {
    font-family: var(--font-serif);
    font-size: 1.05rem;
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-style: italic;
  }

  .post-card {
    padding: 1.75rem 0;
    border-bottom: 1px solid var(--border-soft);
    cursor: pointer;
    transition: none;
    position: relative;
  }
  .post-card:first-of-type { padding-top: 0; }
  .post-card:last-of-type { border-bottom: none; }

  .post-meta-top {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.65rem;
  }
  .post-tag {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 4px;
  }
  .post-date {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .post-title {
    font-family: var(--font-serif);
    font-size: 1.35rem;
    font-weight: 600;
    line-height: 1.35;
    color: var(--text-primary);
    margin-bottom: 0.5rem;
    transition: color 0.15s;
  }
  .post-card:hover .post-title { color: var(--accent); }

  .post-excerpt {
    font-size: 0.95rem;
    color: var(--text-secondary);
    line-height: 1.65;
    font-weight: 300;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .post-footer {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-top: 0.85rem;
  }
  .read-time {
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  .read-more {
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 500;
    letter-spacing: 0.03em;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .post-card:hover .read-more { opacity: 1; }

  /* ─── ARTICLE VIEW ─── */
  #article-view { display: none; }
  #article-view.active { display: block; }

  .article-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--text-muted);
    text-decoration: none;
    margin-bottom: 2rem;
    transition: color 0.15s;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    font-family: var(--font-sans);
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .article-back:hover { color: var(--accent); }
  .article-back svg { transition: transform 0.15s; }
  .article-back:hover svg { transform: translateX(-3px); }

  .article-tag {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1rem;
  }
  .article-title {
    font-family: var(--font-serif);
    font-size: clamp(1.7rem, 4vw, 2.4rem);
    font-weight: 600;
    line-height: 1.25;
    color: var(--text-primary);
    margin-bottom: 1rem;
  }
  .article-subtitle {
    font-size: 1.1rem;
    color: var(--text-secondary);
    font-weight: 300;
    line-height: 1.6;
    margin-bottom: 1.5rem;
    font-family: var(--font-serif);
    font-style: italic;
  }
  .article-meta {

    align-items: center;
    gap: 1rem;
    padding: 1.25rem 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);

    font-size: 0.83rem;
    color: var(--text-muted);

  .article-meta span { display: flex; align-items: center; gap: 5px; }

  .article-body {
    font-family: var(--font-serif);
    font-size: 1.08rem;
    line-height: 1.85;
    color: #d4cfc7;
    max-width: var(--max-w);
  }
  .article-body p { margin-bottom: 1.5em; }
  .article-body h2 {
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--text-primary);
    margin: 2.25em 0 0.75em;
    line-height: 1.3;
  }
  .article-body h3 {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text-primary);
    margin: 1.75em 0 0.5em;
  }
  .article-body blockquote {
    border-left: 3px solid var(--accent);
    padding: 0.25rem 0 0.25rem 1.5rem;
    margin: 2em 0;
    color: var(--text-secondary);
    font-style: italic;
    font-size: 1.12rem;
  }
  .article-body code {
    font-size: 0.88em;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: #c9a96e;
  }
  .article-body pre {
    background: #14131100;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
    overflow-x: auto;
    margin: 1.75em 0;
  }
  .article-body pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 0.88rem;
    line-height: 1.6;
  }
  .article-body a { color: var(--accent); text-decoration: underline; text-decoration-color: rgba(201,169,110,0.4); }
  .article-body a:hover { text-decoration-color: var(--accent); }
  .article-body ul, .article-body ol {
    padding-left: 1.5em;
    margin-bottom: 1.5em;
  }
  .article-body li { margin-bottom: 0.4em; }
  .article-body hr {
    border: none;
    text-align: center;
    margin: 2.5em 0;
    color: var(--text-muted);
    font-size: 1.2rem;
    letter-spacing: 0.4em;
  }
  .article-body hr::before { content: '· · ·'; }

  /* ─── SIDEBAR ─── */
  .sidebar { position: sticky; top: 72px; }

  .sidebar-profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 1.5rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 1.5rem;
  }
  .sidebar-avatar {

    height: 72px;
    border-radius: 50%;
    background: var(--accent-soft);
    border: 2px solid rgba(201,169,110,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.9rem;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }
  .sidebar-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  .sidebar-avatar:hover .avatar-hint { opacity: 1; }
  .avatar-hint {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.2s;
    font-size: 0.65rem;
    color: #fff;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-family: var(--font-sans);
  }
  .sidebar-name {
    font-family: var(--font-serif);
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 0.3rem;
  }
  .sidebar-bio {
    font-size: 0.83rem;
    color: var(--text-secondary);
    line-height: 1.55;
    font-weight: 300;
    margin-bottom: 1rem;
  }
  .sidebar-edit-link {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-decoration: none;
    border: 1px solid var(--border);
    padding: 5px 12px;
    border-radius: 20px;
    transition: color 0.15s, border-color 0.15s;
    display: inline-block;
  }
  .sidebar-edit-link:hover { color: var(--accent); border-color: rgba(201,169,110,0.3); }

  .sidebar-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .sidebar-section-title {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.9rem;
  }
  .topic-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .topic-chip {
    font-size: 0.78rem;
    color: var(--text-secondary);
    background: var(--tag-bg);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 20px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .topic-chip:hover, .topic-chip.active {
    color: var(--accent);
    border-color: rgba(201,169,110,0.35);
    background: var(--accent-soft);
  }

  .archive-list { list-style: none; }
  .archive-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    font-size: 0.83rem;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border-soft);
    cursor: pointer;
    transition: color 0.15s;
  }
  .archive-item:last-child { border-bottom: none; }
  .archive-item:hover { color: var(--accent); }
  .archive-count {
    font-size: 0.72rem;
    color: var(--text-muted);
  }

  /* ─── ABOUT PAGE ─── */

  /* ─── PROFILE PICTURE UPLOAD ─── */
  .upload-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .upload-overlay.open { display: flex; }
  .upload-modal {
    background: #242320;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    width: 100%;
    max-width: 380px;
    margin: 1rem;
  }
  .upload-modal h3 {
    font-family: var(--font-serif);
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 0.4rem;
  }
  .upload-modal p {
    font-size: 0.83rem;
    color: var(--text-muted);
    margin-bottom: 1.5rem;
    line-height: 1.5;
  }
  .upload-drop {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s;
    margin-bottom: 1rem;
  }
  .upload-drop:hover { border-color: rgba(201,169,110,0.4); }
  .upload-drop-text {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 0.5rem;
  }
  .upload-drop-hint {
    font-size: 0.75rem;
    color: var(--text-muted);
    opacity: 0.6;
    margin-top: 0.3rem;
  }
  #avatar-file-input { display: none; }
  .upload-preview {
    display: none;
    text-align: center;
    margin-bottom: 1rem;
  }
  .upload-preview img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(201,169,110,0.3);
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .btn {
    font-size: 0.82rem;
    font-family: var(--font-sans);
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: all 0.15s;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
  }
  .btn-ghost:hover { color: var(--text-primary); background: rgba(255,255,255,0.04); }
  .btn-accent {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: rgba(201,169,110,0.3);
  }
  .btn-accent:hover { background: rgba(201,169,110,0.2); }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #383632; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #4a4740; }
</style>
</head>

const POSTS = [
  {
    id: 1,
    title: "Vedic and MesoAmerican Civilizations",
    subtitle: "",
    tag: "History",
    date: "June 1, 2026",
    readTime: "8 min read",
    excerpt: "Observers have noticed many similarities between Vedic and MesoAmerican cultures — calendrical systems, layered rituals, astronomy, mathematics, and a pantheon of gods. The distance between India and South America suggests an instrumental force must have facilitated this exchange.",
    body: `
      <h2>Abstract</h2>
      <p>Vedic culture is well documented in the vast literature known as the Vedas. Likewise, many distinct civilizations took shape in the Americas and some of the narratives of those cultures survive today. Observers like me have noticed many similarities between the two cultures, two civilizations, two narratives. For instance, both cultures used Vastu, complex calendrical systems, engaged in and conducted layered rituals, and had a very deep understanding of astronomy and mathematics. Both cultures worshipped multiple gods. The significant amount of distance between India and South America suggests that an instrumental force must have facilitated a possible exchange of culture and ideas.</p>

      <h2>1. Introduction</h2>
      <p>What I have noticed, read about, and gathered information about goes as follows.</p>
      <p>The language name "Nahuatl" could have come from the Sanskrit <em>nava tala</em>, meaning "new land." There are also a few other similarities between Mayan words and Sanskrit words. The Incas have a word they use called <em>Viracocha</em>. It carries the civilizational memory of the Gods who came from foreign lands via the oceans to civilize the Incas. The Vedas and Puranas say that Virocana and Mahābali left India to establish kingdoms in faraway lands — possibly the Americas.</p>

      <h2>2. What We Know</h2>
      <p>Using deepsearch I could easily find out what is known to us for now without having to skimming  through thousands of historical archives and PDFs.</p>
      <p>Until recently, historians were convinced that a land bridge from Asia to North America existed more than 12 millennia ago. The assumption beforehand was that these Asian migrants crossed this bridge to come to North America, and then proceeded on to South America sometime around the 13th millennium BCE. Then, evidence of human settlement in Monte Verde in Chile from the 15th millennium BCE was found.</p>
      <p><em>Curcuma longa</em>, the botanical name of common turmeric, is a plant known to originate in Asia, and its most extensive use is in India since time immemorial. Australasian migrants into South America brought this plant along with them, and tribes in Peru — such as the Amahuaca tribe — were found to be using it as a dye plant for body painting, and in some cases as face paint for religious dances, before the Europeans came to South America.</p>

      <h2>3. Ramayana Talks About It</h2>
      <p>In the Kiṣkindhā Kānḍa of the Ramayana, when Sugrīva gives instructions to members of his army's search party to look for Sīta, he describes places that resemble faraway places like Europe, the Arctic Circle, and many places in Southeast Asia, Australia, and the Pacific Ocean, leading up to South America. This paper will focus solely on Sugrīva's remarks about South America. The Rāmāyaṇa provides no evidence to suggest that Sugrīva's search party actually traveled to South America.</p>
      <p>On a seaside mountain belonging to the Andes Mountains in Peru, a massive geoglyph is etched in the petrified sand face of the mountain, measuring 600 feet tall and 2 feet deep. This is known as the Candelabra of the Andes, or the Paracas Candelabra, since it is located near the Peruvian town of Paracas. The age of this geoglyph is unknown, and the best historians have come up with is dating it to around 200 BCE — purely based on speculation, because pottery of that age was found near that mountain. This date of 200 BCE is clearly incorrect.</p>
      <p>A Sanskrit shloka in Valmiki's Ramayana describes a golden pylon resembling a palm tree with three branches as its head. It describes a Vedic havan shape at the bottom — the rectangular box shape visible at the bottom of this etching. This eerily describes and closely resembles the geoglyph we see as the Candelabra of the Andes today. The geoglyph may have been used as a guide for navigators back in prehistoric times.</p>

      <h2>4. What Do the People Who Matter Say About All This</h2>
      <p>Again, thanks to AI deep-search, I could find many quotes and conclusions drawn by scholars and historians claiming that native American civilization was in fact of Indian origins.</p>
      <ul>
        <li>David Sopher noted in 1950 that "the evidence for a pre-European, transpacific introduction of the plant by man seems very strong indeed."</li>
        <li>Scholar Miles Poindexter, a former United States ambassador to Mexico, called the Maya civilization "unquestionably Hindu" in his two-volume 1930s treatise titled <em>The Ayar Incas</em>.</li>
        <li>In 1849, the United States Chargé d'Affaires to Central America, Ephraim George Squier, wrote: "A proper examination of these monuments would disclose the fact that in their interior as well as their exterior form and obvious purposes, these buildings (temples in Palenque, Mexico) correspond with great exactness to those of Hindustan…"</li>
        <li>Scholar Ramon Mena, author of <em>Synthesis of Mexican Archaeology</em>, called the Nahuatl, Zapotec, and Mayan languages "of Hindu origin." According to Mena, "A deep mystery enfolds the tribes that inhabited the state of Chiapas in the district named Palenque… their writing, and the anthropological type, as well as their personal adornments… their system and style of construction clearly indicate the remotest antiquity… all speak of India and the Orient."</li>
        <li>Maya and Hindu temples were adorned with similar decorations and offered animal sacrifices in similar manners. This sacrifice was determined by the same stars and done simultaneously. Maya "scorpion stars" were the same as the constellation Scorpio on Hindu charts.</li>
        <li>Phallic structures were discovered at the Uxmal site in Yucatan, but were removed by authorities in the late 19th century. Hindu culture worships phallic structures through the form of Shiva lingams, representations of Lord Shiva.</li>
        <li>In 1911, renowned mineralogist and archaeologist William Niven discovered ancient ruins beneath volcanic ash near Azcapotzalco in Mexico. Some of the stone tablets recovered from the buried city had photographs of the classic swastika used in India to this date.</li>
      </ul>

      <h2>5. Conclusion</h2>
      <p>This attempt to write about similarities between ancient Vedic and South American civilizations tries to understand the extent to which the two groups were connected. There are many similarities between ancient Indian and South American cultures — in language, gods and goddesses, customs and practices, beliefs, and symbols.</p>
      <p>All these common customs and features support the theory that even though India and South America are on entirely different continents, their interactions proved to be a means of exchanging knowledge and customs that continue to shape both cultures' lifestyles today.</p>
      <p>If similarities in culture are strongly evident, and travel was possible and is mentioned in literature, one can conclude that there was a strong connection and cultural exchange between India and South America during ancient times — going back many millennia, quite possibly 15 millennia. This paper has merely gathered information available on the internet and pointed to the tip of this 'connection between India and the Americas' iceberg.</p>
      <p>The history is fascinating and we are just starting to find out. I do feel like Erwin Smith from Attack on Titan when he discovered the titans under the walls — similarly, this earth has been hiding our history from us, buried underneath it. We may not be able to uncover our truth at all, but at least we will remember this dopamine and this rush we got from searching, trying to uncover and point out patterns through recognition.</p>
      <hr>
      <p><em>Journey mogs Destination ✌️</em></p>

// ─── SITE CONFIG — change these ──────────────────────────────────────────────
const CONFIG = {
  blogName: "",
  authorName: "Marine Biologist",
  bio: "",
  tagline: "Writing on things that matter to me.",
};

// ─── INIT ────────────────────────────────────────────────────────────────────
let currentPage = 'home';

function init() {
  // Apply config
  document.title = CONFIG.blogName;
  document.getElementById('sidebarNameDisplay').textContent = CONFIG.authorName;

  // Load saved avatar from localStorage first, fallback to repo image
  const savedAvatar = localStorage.getItem('blog-avatar');
  if (savedAvatar) {
    setAllAvatars(savedAvatar);
  } else {
    setAllAvatars('images/profile.jpg');
  }

  renderFeed();
  renderTopics();
  renderArchive();
}

function renderFeed(filter = null) {
  const feed = document.getElementById('posts-feed');
  const posts = filter ? POSTS.filter(p => p.tag === filter) : POSTS;
  feed.innerHTML = posts.map(post => `
    <div class="post-card" onclick="openArticle(${post.id})">
      <div class="post-meta-top">
        <span class="post-tag">${post.tag}</span>
        <span class="post-date">${post.date}</span>
      </div>
      <div class="post-title">${post.title}</div>
      <div class="post-excerpt">${post.excerpt}</div>
      <div class="post-footer">
        <span class="read-time">${post.readTime}</span>
        <span class="read-more">Read →</span>
      </div>
    </div>
  `).join('');
  const title = document.querySelector('.feed-title');
  if (title) title.textContent = filter ? `#${filter}` : 'All posts';
}

function renderTopics() {
  const tags = [...new Set(POSTS.map(p => p.tag))];
  document.getElementById('topicList').innerHTML =
    tags.map(t => `<span class="topic-chip" onclick="filterByTag('${t}', this)">${t}</span>`).join('');
}

function filterByTag(tag, el) {
  const chips = document.querySelectorAll('.topic-chip');
  chips.forEach(c => c.classList.remove('active'));
  if (el.classList.contains('active-tag')) {
    el.classList.remove('active-tag');
    renderFeed(null);
  } else {
    chips.forEach(c => c.dataset.tag === tag && c.classList.add('active'));
    el.classList.add('active', 'active-tag');
    renderFeed(tag);
    showPage('home');
  }
}

function renderArchive() {
  const months = {};
  POSTS.forEach(p => {
    const m = p.date.split(' ').slice(0,2).join(' ');
    months[m] = (months[m] || 0) + 1;
  });
  document.getElementById('archiveList').innerHTML =
    Object.entries(months).map(([m, c]) => `
      <li class="archive-item"><span>${m}</span><span class="archive-count">${c} post${c>1?'s':''}</span></li>
    `).join('');
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  document.getElementById('article-view').classList.remove('active');
  document.getElementById('article-view').style.display = 'none';

  const pageEl = document.getElementById('page-' + page);
  if (pageEl) {
    pageEl.classList.add('active');
    pageEl.style.display = 'block';
  }

  const navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');
  currentPage = page;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openArticle(id) {
  const post = POSTS.find(p => p.id === id);
  if (!post) return;

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));

  const av = document.getElementById('article-view');
  av.style.display = 'block';
  av.classList.add('active');

  document.getElementById('article-content').innerHTML = `
    <div class="article-tag">${post.tag}</div>
    <h1 class="article-title">${post.title}</h1>
    ${post.subtitle ? `<p class="article-subtitle">${post.subtitle}</p>` : ''}
    <div class="article-meta">
      <span>${post.date}</span>
      <span>·</span>
      <span>${post.readTime}</span>
    </div>
    <div class="article-body">${post.body}</div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeArticle() {
  document.getElementById('article-view').classList.remove('active');
  document.getElementById('article-view').style.display = 'none';
  showPage('home');
}

// ─── PROFILE PICTURE ─────────────────────────────────────────────────────────
let pendingAvatarDataURL = null;

function openUpload() {
  document.getElementById('uploadOverlay').classList.add('open');
  document.getElementById('uploadPreview').style.display = 'none';
  document.getElementById('saveAvatarBtn').style.display = 'none';
  document.getElementById('uploadDrop').style.display = 'block';
  pendingAvatarDataURL = null;
}

function closeUpload() {
  document.getElementById('uploadOverlay').classList.remove('open');
  document.getElementById('avatar-file-input').value = '';
}

document.getElementById('avatar-file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    pendingAvatarDataURL = ev.target.result;
    document.getElementById('uploadPreviewImg').src = pendingAvatarDataURL;
    document.getElementById('uploadPreview').style.display = 'block';
    document.getElementById('uploadDrop').style.display = 'none';
    document.getElementById('saveAvatarBtn').style.display = 'inline-block';
  };
  reader.readAsDataURL(file);
});

function saveAvatar() {
  if (!pendingAvatarDataURL) return;
  localStorage.setItem('blog-avatar', pendingAvatarDataURL);
  setAllAvatars(pendingAvatarDataURL);
  closeUpload();
}

function setAllAvatars(src) {
  ['navAvatarImg','sidebarAvatarImg'].forEach(id => {
    const img = document.getElementById(id);
    if (img) { img.src = src; img.style.display = 'block'; }
  });
  // hide placeholder SVGs
  document.querySelectorAll('.avatar svg, .sidebar-avatar > svg, .about-avatar > svg').forEach(svg => {
    svg.style.display = 'none';
  });
}

// ─── DRAG-AND-DROP on upload modal ───────────────────────────────────────────
const drop = document.getElementById('uploadDrop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.borderColor = 'rgba(201,169,110,0.5)'; });
drop.addEventListener('dragleave', () => { drop.style.borderColor = ''; });
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.style.borderColor = '';
  const file = e.dataTransfer.files[0];
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = ev => {
    pendingAvatarDataURL = ev.target.result;
    document.getElementById('uploadPreviewImg').src = pendingAvatarDataURL;
    document.getElementById('uploadPreview').style.display = 'block';
    document.getElementById('uploadDrop').style.display = 'none';
    document.getElementById('saveAvatarBtn').style.display = 'inline-block';
  };
  reader.readAsDataURL(file);
});

// Close overlay on backdrop click
document.getElementById('uploadOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeUpload();
});

init();
</script>
